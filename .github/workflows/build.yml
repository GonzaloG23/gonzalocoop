name: Build

on:
  push:
    branches:
      - main
      - migracion-ministerio
  pull_request:
    branches:
      - main
      - migracion-ministerio

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
