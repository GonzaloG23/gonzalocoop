name: Fix compact commission

on:
  push:
    branches:
      - migracion-ministerio

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'fix: compactar comision directiva plegada')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: migracion-ministerio

      - name: Ajustar altura del bloque plegado
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/_authenticated/comision.tsx')
          s = p.read_text()
          old = '<details open={editando} className="rounded-sm border border-border bg-card">'
          new = '<details open={editando} className="self-start rounded-sm border border-border bg-card">'
          if old not in s:
              raise SystemExit('No se encontró el bloque esperado.')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Quitar workflow temporal
        run: rm -f .github/workflows/fix-compact-comision.yml

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_authenticated/comision.tsx .github/workflows/fix-compact-comision.yml
          git commit -m "fix: compactar comision directiva plegada"
          git push